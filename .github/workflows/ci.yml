name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest
      - run: pip-audit
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t tessera:ci .
      - name: CLI runs
        run: docker run --rm tessera:ci --help
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id tessera:ci -u)" = "10001"
      - name: Hardened ingest and replay smoke test
        run: |
          docker volume create smoke-data
          docker run -d --name ing --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:14550:14550/udp \
            -v smoke-data:/data tessera:ci ingest-mavlink --db /data/smoke.db \
            --bind 0.0.0.0 --port 14550 --max-events 40 --idle-timeout 30
          sleep 3
          python3 - <<'PY'
          import pathlib, socket
          data = pathlib.Path("tests/fixtures/sitl_global_position_int.bin").read_bytes()
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          for offset in range(0, len(data), 40):
              sock.sendto(data[offset:offset + 40], ("127.0.0.1", 14550))
          PY
          test "$(docker wait ing)" = "0"
          docker logs ing 2>&1 | tee ingest.log
          grep -q "stored 40 observations" ingest.log
          docker run --rm -v smoke-data:/data tessera:ci replay --db /data/smoke.db --format geojson \
            | python3 -c "import json,sys; n=len(json.load(sys.stdin)['features']); assert n == 40, n; print('replayed', n)"
      - name: Signed sync to hub smoke test
        run: |
          docker network create tnet
          docker volume create keys
          docker volume create trusted
          docker volume create hubdata
          docker run --rm -v keys:/keys -v trusted:/trusted --entrypoint sh tessera:ci \
            -c "tessera keygen --out /keys/edge-1 && cp /keys/edge-1.pub /trusted/edge-1.pub"
          docker run -d --name hub --network tnet --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 \
            -v hubdata:/data -v trusted:/trusted:ro tessera:ci \
            hub --db /data/hub.db --host 0.0.0.0 --port 8080 --trusted-keys /trusted
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          docker run --rm --network tnet --read-only --tmpfs /tmp --cap-drop ALL \
            -v smoke-data:/data -v keys:/keys:ro tessera:ci \
            sync --db /data/smoke.db --hub-url http://hub:8080 --edge-id edge-1 \
            --key /keys/edge-1 --once --allow-insecure-http 2>&1 | tee sync.log
          grep -q "synced 40 events" sync.log
          curl -fs http://127.0.0.1:8080/v1/features | python3 -c "import json,sys; f=json.load(sys.stdin)['features']; assert len(f)==1 and f[0]['properties']['fixes_in_window']==40, f; print('hub has', f[0]['properties']['fixes_in_window'], 'fixes')"
          curl -fsI http://127.0.0.1:8080/ | grep -qi "content-security-policy"
          docker logs hub 2>&1 | tail -5
