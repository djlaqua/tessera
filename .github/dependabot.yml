version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Do not raise lower bounds to the newest release; only widen when a bump is required.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
