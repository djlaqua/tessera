# ArduPilot SITL -> relay -> Tessera ingest, on an internal network.
# Run: docker compose -f docker-compose.sitl.yml up --build --abort-on-container-exit --exit-code-from tessera
# Read results: docker compose -f docker-compose.sitl.yml run --rm --no-deps tessera replay --db /data/flight.db
services:
  sitl:
    build:
      context: .
      dockerfile: Dockerfile.sitl
    networks: [telemetry]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tessera:
    build: .
    command: ["ingest-mavlink", "--db", "/data/flight.db", "--bind", "0.0.0.0", "--port", "14550", "--max-events", "200", "--idle-timeout", "90"]
    volumes: ["flightdata:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [telemetry]

  relay:
    build: .
    image: tessera-relay
    entrypoint: ["python", "/opt/tessera/scripts/sitl_relay.py"]
    command: ["--tcp", "sitl:5760", "--udp", "tessera:14550", "--seconds", "75", "--rate-hz", "10"]
    depends_on: [sitl, tessera]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [telemetry]

volumes:
  flightdata:

networks:
  telemetry:
    internal: true
